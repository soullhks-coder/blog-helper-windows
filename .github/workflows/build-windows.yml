name: Build macOS and Windows Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements-windows.txt

      - name: Verify Windows and Playwright dependencies
        shell: pwsh
        run: |
          python -m py_compile main.py
          python -c "import customtkinter, certifi, keyring, playwright, yt_dlp; print('dependency import passed')"
          $chromeCandidates = @(
            "$env:PROGRAMFILES\Google\Chrome\Application\chrome.exe",
            "${env:PROGRAMFILES(X86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $chromeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw "Google Chrome was not found on the Windows runner." }
          Write-Host "Chrome detected: $chrome"

      - name: Build BlogHelper.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean BlogHelper.spec
          if (-not (Test-Path "dist\BlogHelper.exe")) { throw "BlogHelper.exe was not created." }

      - name: Create delivery ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release\BlogHelper-Windows" | Out-Null
          Copy-Item "dist\BlogHelper.exe" "release\BlogHelper-Windows\BlogHelper.exe"
          @"
          Blog Helper Pro - Windows

          1. Google Chrome이 설치된 Windows 10/11에서 BlogHelper.exe를 더블클릭하세요.
          2. Windows SmartScreen이 표시되면 '추가 정보' > '실행'을 선택하세요.
          3. Playwright 로그인 정보와 앱 설정은 %LOCALAPPDATA%\Blog Helper에 저장됩니다.
          4. 최초 네이버/티스토리 자동화 실행 시 열린 전용 Chrome에서 한 번 로그인하세요.
          "@ | Set-Content -Encoding UTF8 "release\BlogHelper-Windows\README.txt"
          Compress-Archive -Path "release\BlogHelper-Windows\*" -DestinationPath "release\BlogHelper-Windows.zip" -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlogHelper-Windows
          path: |
            release/BlogHelper-Windows/BlogHelper.exe
            release/BlogHelper-Windows/README.txt
            release/BlogHelper-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach files to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/BlogHelper-Windows/BlogHelper.exe
            release/BlogHelper-Windows.zip

  build-macos:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements-windows.txt

      - name: Verify macOS dependencies
        run: |
          python -m py_compile main.py
          python -c "import customtkinter, certifi, keyring, playwright, yt_dlp; print('dependency import passed')"

      - name: Build BlogHelper.app
        run: |
          python -m PyInstaller --noconfirm --clean BlogHelperMac.spec
          test -d "dist/BlogHelper.app"
          codesign --force --deep --sign - "dist/BlogHelper.app"

      - name: Create delivery ZIP
        run: |
          mkdir -p "release/BlogHelper-macOS"
          cat > "release/BlogHelper-macOS/README.txt" <<'EOF'
          Blog Helper Pro - macOS

          1. BlogHelper-macOS.zip의 압축을 풀고 BlogHelper.app을 Applications 폴더로 옮기세요.
          2. 최초 실행이 차단되면 앱을 Control-클릭한 뒤 '열기'를 선택하세요.
          3. Google Chrome이 필요하며, 로그인 세션과 앱 설정은 사용자 Library 폴더에 저장됩니다.
          4. 이 자동 빌드는 Intel Mac용이며 Apple Silicon Mac에서는 Rosetta로 실행됩니다.
          EOF
          ditto -c -k --sequesterRsrc --keepParent "dist/BlogHelper.app" "release/BlogHelper-macOS/BlogHelper-macOS.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlogHelper-macOS
          path: |
            release/BlogHelper-macOS/README.txt
            release/BlogHelper-macOS/BlogHelper-macOS.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach files to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/BlogHelper-macOS/BlogHelper-macOS.zip
