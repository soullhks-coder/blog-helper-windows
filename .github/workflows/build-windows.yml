name: Build macOS and Windows Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements-windows.txt

      - name: Verify Windows and Playwright dependencies
        shell: pwsh
        run: |
          python -m py_compile main.py
          python -m py_compile app_updater.py
          python -c "import customtkinter, certifi, keyring, playwright, yt_dlp; from PIL import Image; print('dependency import passed')"
          $chromeCandidates = @(
            "$env:PROGRAMFILES\Google\Chrome\Application\chrome.exe",
            "${env:PROGRAMFILES(X86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $chromeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw "Google Chrome was not found on the Windows runner." }
          Write-Host "Chrome detected: $chrome"

      - name: Build BlogHelper.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean BlogHelper.spec
          if (-not (Test-Path "dist\BlogHelper.exe")) { throw "BlogHelper.exe was not created." }

      - name: Create delivery ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release\BlogHelper-Windows" | Out-Null
          Copy-Item "dist\BlogHelper.exe" "release\BlogHelper-Windows\BlogHelper.exe"
          @"
          Blog Helper Pro - Windows

          1. Google Chrome이 설치된 Windows 10/11에서 BlogHelper.exe를 더블클릭하세요.
          2. Windows SmartScreen이 표시되면 '추가 정보' > '실행'을 선택하세요.
          3. Playwright 로그인 정보와 앱 설정은 %LOCALAPPDATA%\Blog Helper에 저장됩니다.
          4. 최초 네이버/티스토리 자동화 실행 시 열린 전용 Chrome에서 한 번 로그인하세요.
          "@ | Set-Content -Encoding UTF8 "release\BlogHelper-Windows\README.txt"
          Compress-Archive -Path "release\BlogHelper-Windows\*" -DestinationPath "release\BlogHelper-Windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlogHelper-Windows
          path: |
            release/BlogHelper-Windows/BlogHelper.exe
            release/BlogHelper-Windows/README.txt
            release/BlogHelper-Windows.zip
          if-no-files-found: error
          retention-days: 30

  build-macos:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements-windows.txt

      - name: Verify macOS dependencies
        run: |
          python -m py_compile main.py
          python -m py_compile app_updater.py
          python -c "import customtkinter, certifi, keyring, playwright, yt_dlp; from PIL import Image; print('dependency import passed')"

      - name: Build BlogHelper.app
        run: |
          python -m PyInstaller --noconfirm --clean BlogHelperMac.spec
          test -d "dist/BlogHelper.app"
          codesign --force --deep --sign - "dist/BlogHelper.app"

      - name: Create delivery ZIP
        run: |
          mkdir -p "release/BlogHelper-macOS"
          cat > "release/BlogHelper-macOS/README.txt" <<'EOF'
          Blog Helper Pro - macOS

          1. BlogHelper-macOS.zip의 압축을 풀고 BlogHelper.app을 Applications 폴더로 옮기세요.
          2. 최초 실행이 차단되면 앱을 Control-클릭한 뒤 '열기'를 선택하세요.
          3. Google Chrome이 필요하며, 로그인 세션과 앱 설정은 사용자 Library 폴더에 저장됩니다.
          4. 이 자동 빌드는 Apple Silicon Mac용입니다.
          EOF
          ditto -c -k --sequesterRsrc --keepParent "dist/BlogHelper.app" "release/BlogHelper-macOS/BlogHelper-macOS.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlogHelper-macOS
          path: |
            release/BlogHelper-macOS/README.txt
            release/BlogHelper-macOS/BlogHelper-macOS.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout version metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches app version
        run: |
          APP_VERSION="$(python -c 'import json; print(json.load(open("version.json", encoding="utf-8"))["version"])')"
          if [ "${GITHUB_REF_NAME}" != "v${APP_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version.json (${APP_VERSION})."
            exit 1
          fi

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: BlogHelper-Windows
          path: release-assets/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: BlogHelper-macOS
          path: release-assets/macos

      - name: Build small incremental update patches
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          RELEASE_REPOSITORY: soullhks-coder/blog-helper-releases
        run: |
          APP_VERSION="$(python -c 'import json; print(json.load(open("version.json", encoding="utf-8"))["version"])')"
          PREVIOUS_TAG="$(git tag --sort=-version:refname | grep -Fxv "${GITHUB_REF_NAME}" | head -n 1)"
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous release tag; skipping incremental patches."
            exit 0
          fi
          PREVIOUS_VERSION="${PREVIOUS_TAG#v}"
          mkdir -p release-assets/previous release-assets/patches
          gh release download "$PREVIOUS_TAG" \
            --repo "$RELEASE_REPOSITORY" \
            --dir release-assets/previous \
            --pattern 'BlogHelper.exe' \
            --pattern 'BlogHelper-macOS.zip' \
            --clobber
          python -m pip install 'bsdiff4>=1.2.6,<2'

          WINDOWS_EXE="$(find release-assets/windows -type f -name 'BlogHelper.exe' -print -quit)"
          MACOS_ZIP="$(find release-assets/macos -type f -name 'BlogHelper-macOS.zip' -print -quit)"
          python tools/build_delta_patch.py \
            --platform windows \
            --previous release-assets/previous/BlogHelper.exe \
            --current "$WINDOWS_EXE" \
            --from-version "$PREVIOUS_VERSION" \
            --to-version "$APP_VERSION" \
            --output "release-assets/patches/BlogHelper-Windows-v${PREVIOUS_VERSION}-to-v${APP_VERSION}.patch.zip"
          python tools/build_delta_patch.py \
            --platform macos \
            --previous release-assets/previous/BlogHelper-macOS.zip \
            --current "$MACOS_ZIP" \
            --from-version "$PREVIOUS_VERSION" \
            --to-version "$APP_VERSION" \
            --output "release-assets/patches/BlogHelper-macOS-v${PREVIOUS_VERSION}-to-v${APP_VERSION}.patch.zip"
          ls -lh release-assets/patches

      - name: Publish public binary release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          RELEASE_REPOSITORY: soullhks-coder/blog-helper-releases
        run: |
          WINDOWS_EXE="$(find release-assets/windows -type f -name 'BlogHelper.exe' -print -quit)"
          WINDOWS_ZIP="$(find release-assets/windows -type f -name 'BlogHelper-Windows.zip' -print -quit)"
          MACOS_ZIP="$(find release-assets/macos -type f -name 'BlogHelper-macOS.zip' -print -quit)"
          test -n "$WINDOWS_EXE" && test -f "$WINDOWS_EXE"
          test -n "$WINDOWS_ZIP" && test -f "$WINDOWS_ZIP"
          test -n "$MACOS_ZIP" && test -f "$MACOS_ZIP"

          ASSETS=(
            "$WINDOWS_EXE#BlogHelper.exe"
            "$WINDOWS_ZIP#BlogHelper-Windows.zip"
            "$MACOS_ZIP#BlogHelper-macOS.zip"
          )
          while IFS= read -r PATCH_FILE; do
            ASSETS+=("$PATCH_FILE#$(basename "$PATCH_FILE")")
          done < <(find release-assets/patches -type f -name '*.patch.zip' -print 2>/dev/null | sort)

          RELEASE_NOTES="Blog Helper Pro ${GITHUB_REF_NAME}\n\n프로그램 시작 시 변경된 부분만 빠르게 내려받습니다. 패치를 적용할 수 없는 경우에만 전체 파일로 안전하게 전환합니다."
          if gh release view "$GITHUB_REF_NAME" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "${ASSETS[@]}" \
              --repo "$RELEASE_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "${ASSETS[@]}" \
              --repo "$RELEASE_REPOSITORY" \
              --title "Blog Helper Pro ${GITHUB_REF_NAME}" \
              --notes "$RELEASE_NOTES"
          fi
