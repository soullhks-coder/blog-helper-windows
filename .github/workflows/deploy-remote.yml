name: Deploy Remote Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "remote_gateway/**"
      - ".github/workflows/deploy-remote.yml"

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: remote_gateway
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Require Cloudflare deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare deployment credentials are missing. Validation alone must not be reported as a successful deployment."
            exit 1
          fi

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy
